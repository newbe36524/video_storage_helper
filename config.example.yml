transcode_input_dirs:
- /path/to/video-input

transcode_output_dir: /path/to/video-output

zip_input_dirs:
- /path/to/archive-input

zip_output_dir: /path/to/archive-output
- /path/to/input1
- /path/to/input2

data_file: data.yml

extensions:
- .mp4
- .mkv
- .mov
- .avi
- .webm
- .m4v
- .ts
- .mts
- .m2ts

ffmpeg: ffmpeg
ffprobe: ffprobe
hwaccel: cuda
cuda_decoder: auto
concurrent_workers: 5
hash_prefix_bytes: 1048576
max_processed_per_run: 0

encoder_preference: auto
nvenc_preset: p1
nvenc_tune: ll
nvenc_cq: 28
nvenc_spatial_aq: false
nvenc_temporal_aq: false
nvenc_multipass: disabled
nvenc_rc_lookahead: 0
svtav1_preset: 6
svtav1_crf: 32

audio_codec: aac
audio_bitrate: 192k

faststart: true
overwrite: false

# Set operation to archive_7z to encrypt each source file instead.
# seven_zip: 7z
# seven_zip_password_env: VIDEO_STORAGE_7Z_PASSWORD
# seven_zip_password: do-not-commit-a-password-here
